<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Table Comparison - Part 1</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding: 20px;
            background-color: #f4f7f6;
            color: #333;
        }
        .container {
            max-width: 900px;
            margin: auto;
            background: white;
            padding: 2rem;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        h2 {
            text-align: center;
            color: #2c3e50;
        }
        .controls {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 20px;
        }
        button {
            padding: 10px 20px;
            font-size: 1rem;
            cursor: pointer;
            border: none;
            border-radius: 4px;
            transition: background 0.3s;
        }
        .btn-innerHTML {
            background-color: #3498db;
            color: white;
        }
        .btn-innerHTML:hover { background-color: #2980b9; }
        
        .btn-DOM {
            background-color: #2ecc71;
            color: white;
        }
        .btn-DOM:hover { background-color: #27ae60; }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }
        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }
        th {
            background-color: #f8f9fa;
            color: #2c3e50;
        }
        tr:hover {
            background-color: #f1f1f1;
        }
        .status {
            text-align: center;
            font-style: italic;
            margin-top: 10px;
            color: #7f8c8d;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Product Table Comparison</h2>
    
    <div class="controls">
        <button class="btn-innerHTML" onclick="loadUsingInnerHTML()">Load using innerHTML</button>
        <button class="btn-DOM" onclick="loadUsingDOM()">Load using Direct DOM</button>
    </div>

    <p id="method-status" class="status">Click a button to load product data.</p>

    <table border="1">
        <thead>
            <tr>
                <th>Product Name</th>
                <th>Price</th>
                <th>Category</th>
            </tr>
        </thead>
        <tbody id="tableBody">
            </tbody>
    </table>
</div>

<script>
    // 5 Products as required
    const products = [
        { name: "Smartphone", price: "₱15,000", category: "Electronics" },
        { name: "Mechanical Keyboard", price: "₱2,500", category: "Peripherals" },
        { name: "Running Shoes", price: "₱3,200", category: "Sportswear" },
        { name: "Coffee Maker", price: "₱1,800", category: "Appliances" },
        { name: "Wireless Mouse", price: "₱1,200", category: "Peripherals" }
    ];

    const tableBody = document.getElementById("tableBody");
    const statusText = document.getElementById("method-status");

    // A. Using innerHTML
    function loadUsingInnerHTML() {
        tableBody.innerHTML = ""; // Clear existing data
        let output = "";

        products.forEach(product => {
            // Building a long string of HTML
            output += `<tr>
                <td>${product.name}</td>
                <td>${product.price}</td>
                <td>${product.category}</td>
            </tr>`;
        });

        // Injecting the string all at once
        tableBody.innerHTML = output;
        statusText.innerText = "Data loaded via innerHTML method.";
        console.log("Table loaded using innerHTML.");
    }

    // B. Using Direct DOM Manipulation
    function loadUsingDOM() {
        tableBody.innerHTML = ""; // Clear existing data

        products.forEach(product => {
            // Creating elements one by one
            let tr = document.createElement("tr");

            let tdName = document.createElement("td");
            tdName.textContent = product.name;

            let tdPrice = document.createElement("td");
            tdPrice.textContent = product.price;

            let tdCategory = document.createElement("td");
            tdCategory.textContent = product.category;

            // Appending children to the row
            tr.appendChild(tdName);
            tr.appendChild(tdPrice);
            tr.appendChild(tdCategory);

            // Appending the row to the tbody
            tableBody.appendChild(tr);
        });

        statusText.innerText = "Data loaded via Direct DOM method.";
        console.log("Table loaded using Direct DOM Manipulation.");
    }
</script>

</body>
</html>
