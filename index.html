<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome to BIMS</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="login-container">
        <header class="login-header">
            <h1>Barangay Information Management System</h1>
            <p>Centralized Digital Administrative & Document Desk</p>
        </header>

        <main class="card login-card">
            <h2>Portal Authentication</h2>
            
            <div class="role-selector">
                <button type="button" class="role-tab active" id="tabResident" onclick="setRole('Resident')">🙋‍♂️ Resident</button>
                <button type="button" class="role-tab" id="tabAdmin" onclick="setRole('Admin')">⚙️ Administration</button>
            </div>

            <!-- Sub-actions toggle specific to Residents -->
            <div class="action-selector" id="residentActionToggle" style="display: flex; gap: 15px; justify-content: center; margin-bottom: 20px; font-size: 0.9rem;">
                <label style="display:flex; align-items:center; gap:5px; cursor:pointer;">
                    <input type="radio" name="resMode" value="login" checked onclick="setResidentMode('login')"> Existing Resident Sign-In
                </label>
                <label style="display:flex; align-items:center; gap:5px; cursor:pointer;">
                    <input type="radio" name="resMode" value="register" onclick="setResidentMode('register')"> Create Profile Account
                </label>
            </div>

            <form id="loginForm">
                <input type="hidden" id="userRole" value="Resident">
                <input type="hidden" id="residentMode" value="login">

                <div class="form-group">
                    <label for="username" id="usernameLabel">Resident Full Name</label>
                    <input type="text" id="username" required placeholder="e.g., Juan Dela Cruz">
                </div>

                <!-- Registration fields (hidden by default during normal login) -->
                <div id="registrationFields" style="display: none;">
                    <div class="form-group">
                        <label for="userBirthday">Date of Birth</label>
                        <input type="date" id="userBirthday">
                    </div>
                    <div class="form-group">
                        <label for="userAddress">Complete Address</label>
                        <input type="text" id="userAddress" placeholder="Purok, Street Name, House Number">
                    </div>
                </div>

                <div class="form-group" id="passwordGroup" style="display: none;">
                    <label for="password">Administrative Password</label>
                    <input type="password" id="password" placeholder="••••••••">
                </div>

                <button type="submit" id="btnSubmitForm" class="btn-login">Access Portal</button>
            </form>
            <div id="loginFeedback" class="feedback-msg"></div>
        </main>
    </div>

    <script src="bims-core.js"></script>
    <script src="login.js"></script>
</body>
</html>
